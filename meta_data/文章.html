<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技术文章收藏</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --txt:#1f2328; --muted:#8a9099; --accent:#2f6feb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:0 0 16px; }
  .addbar { display:flex; gap:8px; flex-wrap:wrap; background:var(--card); padding:14px; border:1px solid var(--line); border-radius:12px; }
  .addbar input { flex:1; min-width:160px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .addbar input.title { flex:2; }
  .addbar button { padding:9px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
  .addbar button:hover { filter:brightness(1.08); }
  ul.list { list-style:none; margin:18px 0 0; padding:0; }
  li.item { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:8px; }
  .item .main { flex:1; min-width:0; }
  .item .t { font-size:14px; font-weight:600; margin-bottom:3px; word-break:break-word; }
  .item .u { font-size:12px; color:var(--muted); text-decoration:none; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .item .u:hover { color:var(--accent); }
  .item .copy { flex:none; width:32px; height:32px; border:1px solid var(--line); border-radius:7px; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .item .copy:hover { color:var(--accent); border-color:var(--accent); }
  .item .del { flex:none; width:28px; height:28px; border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:16px; }
  .item .del:hover { color:#e5484d; }
  .toast { position:fixed; left:50%; bottom:32px; transform:translateX(-50%); background:#1f2328; color:#fff; padding:8px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .count { font-size:12px; color:var(--muted); margin-left:8px; font-weight:400; }
  .banner { background:#fff7e6; border:1px solid #ffd591; color:#ad6800; font-size:13px; padding:8px 12px; border-radius:8px; margin-bottom:14px; display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>技术文章收藏 <span class="count" id="count"></span></h1>
  <div class="banner" id="banner">未通过本地服务打开，添加的数据不会保存。请用 server.py 启动后访问。</div>
  <div class="addbar">
    <input class="title" id="inTitle" placeholder="标题（可留空，自动取域名）">
    <input class="url" id="inUrl" placeholder="URL，例如 https://...">
    <button id="addBtn">添加</button>
  </div>
  <ul class="list" id="list"></ul>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const list = $('#list');
let ARTICLES = [];
let canPersist = true;

function hostOf(url){ try { return new URL(url).hostname.replace(/^www\./,''); } catch { return url; } }

function render() {
  $('#count').textContent = ARTICLES.length ? `共 ${ARTICLES.length} 条` : '';
  list.innerHTML = '';
  ARTICLES.forEach((a, i) => {
    const li = document.createElement('li'); li.className = 'item';
    const main = document.createElement('div'); main.className = 'main';
    const t = document.createElement('div'); t.className = 't'; t.textContent = a.title || hostOf(a.url);
    const ua = document.createElement('a'); ua.className='u'; ua.href=a.url; ua.target='_blank'; ua.rel='noopener'; ua.textContent=a.url; ua.title=a.url;
    main.appendChild(t); main.appendChild(ua); li.appendChild(main);

    const copy = document.createElement('button'); copy.className='copy'; copy.title='复制 URL';
    copy.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    copy.onclick = () => copyUrl(a.url);
    li.appendChild(copy);

    const del = document.createElement('button'); del.className='del'; del.title='删除'; del.textContent='×';
    del.onclick = () => remove(i);
    li.appendChild(del);

    list.appendChild(li);
  });
}

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1500); }

function copyUrl(url){
  navigator.clipboard.writeText(url).then(()=>toast('已复制 URL')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('已复制 URL');
  });
}

async function persist(){
  if(!canPersist) return;
  try {
    const r = await fetch('data.json', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(ARTICLES, null, 2) });
    if(!r.ok) throw new Error('save failed');
  } catch(e){ canPersist=false; $('#banner').style.display='block'; toast('保存失败：请用本地服务打开'); }
}

async function add(){
  const title = $('#inTitle').value.trim();
  let url = $('#inUrl').value.trim();
  if(!url){ toast('请输入 URL'); return; }
  if(!/^https?:\/\//i.test(url)) url='https://'+url;
  ARTICLES.unshift({ title, url });
  render();
  $('#inTitle').value=''; $('#inUrl').value=''; $('#inUrl').focus();
  await persist();
}

async function remove(i){
  ARTICLES.splice(i,1); render(); await persist();
}

$('#addBtn').onclick = add;
$('#inUrl').addEventListener('keydown', e=>{ if(e.key==='Enter') add(); });
$('#inTitle').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#inUrl').focus(); });

(async ()=>{
  try {
    const r = await fetch('data.json', { cache:'no-store' });
    if(!r.ok) throw new Error();
    ARTICLES = await r.json();
  } catch(e){
    canPersist = false; $('#banner').style.display='block';
    ARTICLES = [];
  }
  render();
})();
</script>
</body>
</html>
