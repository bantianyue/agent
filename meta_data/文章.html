<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技术文章收藏</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --txt:#1f2328; --muted:#8a9099; --accent:#2f6feb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); }
  .wrap { max-width:960px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:0 0 16px; }
  .addbar { display:flex; gap:8px; flex-wrap:wrap; background:var(--card); padding:14px; border:1px solid var(--line); border-radius:12px; }
  .addbar input { flex:1; min-width:140px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .addbar input.title { flex:3; }
  .addbar select { padding:9px 8px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#fff; }
  .addbar button { padding:9px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
  .addbar button:hover { filter:brightness(1.08); }
  .toolbar { display:flex; gap:10px; align-items:center; margin:14px 0 4px; font-size:13px; color:var(--muted); }
  .toolbar select { padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
  ul.list { list-style:none; margin:10px 0 0; padding:0; }
  li.item { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:8px; }
  li.item.done { opacity:.55; }
  li.item.done .t { text-decoration:line-through; }
  .item .pri { flex:none; }
  .item .pri select { padding:4px 6px; border:1px solid var(--line); border-radius:6px; font-size:12px; background:#fff; }
  .item .main { flex:1; min-width:0; }
  .item .t { font-size:14px; font-weight:600; margin-bottom:3px; word-break:break-word; }
  .item .u { font-size:12px; color:var(--muted); text-decoration:none; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .item .u:hover { color:var(--accent); }
  .item .donebox { flex:none; display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); cursor:pointer; user-select:none; }
  .item .donebox input { width:16px; height:16px; cursor:pointer; }
  .item .copy { flex:none; width:32px; height:32px; border:1px solid var(--line); border-radius:7px; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .item .copy:hover { color:var(--accent); border-color:var(--accent); }
  .item .del { flex:none; width:28px; height:28px; border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:16px; }
  .item .del:hover { color:#e5484d; }
  .toast { position:fixed; left:50%; bottom:32px; transform:translateX(-50%); background:#1f2328; color:#fff; padding:8px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .count { font-size:12px; color:var(--muted); margin-left:8px; font-weight:400; }
  .banner { background:#fff7e6; border:1px solid #ffd591; color:#ad6800; font-size:13px; padding:8px 12px; border-radius:8px; margin-bottom:14px; display:none; }
  .p-high { color:#e5484d; font-weight:600; }
  .p-mid { color:#d99100; }
  .p-low { color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>技术文章收藏 <span class="count" id="count"></span></h1>
  <div class="banner" id="banner">未通过本地服务打开，添加的数据不会保存。请用 server.py 启动后访问。</div>
  <div class="addbar">
    <input class="title" id="inTitle" placeholder="标题（可留空，自动取域名）">
    <input class="url" id="inUrl" placeholder="URL，例如 https://...">
    <select id="inPri" title="优先级">
      <option value="high">高</option>
      <option value="mid" selected>中</option>
      <option value="low">低</option>
    </select>
    <button id="addBtn">添加</button>
  </div>
  <div class="toolbar">
    <span>排序：</span>
    <select id="sortSel">
      <option value="time" selected>按添加顺序（新→旧）</option>
      <option value="pri">按优先级</option>
      <option value="done">未完成优先</option>
    </select>
    <span id="stats"></span>
  </div>
  <ul class="list" id="list"></ul>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const list = $('#list');
let ARTICLES = [];
let canPersist = true;
let saveFailed = false;
const PRI_RANK = { high:0, mid:1, low:2 };

function hostOf(url){ try { return new URL(url).hostname.replace(/^www\./,''); } catch { return url; } }
function priLabel(p){ return p==='high'?'高':p==='low'?'低':'中'; }

function render() {
  $('#count').textContent = ARTICLES.length ? `共 ${ARTICLES.length} 条` : '';
  const doneCnt = ARTICLES.filter(a=>a.done).length;
  $('#stats').textContent = `已完成 ${doneCnt} / 未完成 ${ARTICLES.length-doneCnt}`;
  const sort = $('#sortSel').value;
  let arr = ARTICLES.slice();
  if (sort==='pri') arr.sort((a,b)=> (PRI_RANK[a.priority]??1)-(PRI_RANK[b.priority]??1) || (ARTICLES.indexOf(b)-ARTICLES.indexOf(a)));
  else if (sort==='done') arr.sort((a,b)=> (a.done?1:0)-(b.done?1:0) || (PRI_RANK[a.priority]??1)-(PRI_RANK[b.priority]??1));
  // time: 按 pos 倒序（pos 相同则按 id 倒序），最新加入的在最上方
  else if (sort==='time') arr.sort((a,b)=> (b.pos??0)-(a.pos??0) || (b.id??0)-(a.id??0));
  arr.forEach(a => {
    const idx = ARTICLES.indexOf(a);
    const li = document.createElement('li'); li.className = 'item' + (a.done?' done':'');
    // 优先级
    const pri = document.createElement('div'); pri.className='pri';
    const sel = document.createElement('select'); sel.title='优先级';
    [['high','高'],['mid','中'],['low','低']].forEach(([v,t])=>{ const o=document.createElement('option'); o.value=v; o.textContent=t; if((a.priority||'mid')===v)o.selected=true; sel.appendChild(o); });
    sel.onchange = () => { a.priority = sel.value; render(); persist(); };
    pri.appendChild(sel); li.appendChild(pri);
    // 主体
    const main = document.createElement('div'); main.className = 'main';
    const t = document.createElement('div'); t.className = 't'; t.textContent = a.title || hostOf(a.url);
    const ua = document.createElement('a'); ua.className='u'; ua.href=a.url; ua.target='_blank'; ua.rel='noopener'; ua.textContent=a.url; ua.title=a.url;
    main.appendChild(t); main.appendChild(ua); li.appendChild(main);
    // 完成勾选
    const db = document.createElement('label'); db.className='donebox';
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=!!a.done; cb.title='已完成（已生成公众号文章）';
    cb.onchange = () => { a.done = cb.checked; render(); persist(); };
    db.appendChild(cb); db.appendChild(document.createTextNode('完成'));
    li.appendChild(db);
    // 复制
    const copy = document.createElement('button'); copy.className='copy'; copy.title='复制 URL';
    copy.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    copy.onclick = () => copyUrl(a.url);
    li.appendChild(copy);
    // 删除
    const del = document.createElement('button'); del.className='del'; del.title='删除'; del.textContent='×';
    del.onclick = () => remove(idx);
    li.appendChild(del);
    list.appendChild(li);
  });
}

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1500); }

function copyUrl(url){
  navigator.clipboard.writeText(url).then(()=>toast('已复制 URL')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('已复制 URL');
  });
}

async function persist(){
  if(!canPersist) return;
  try {
    const r = await fetch('/api/articles', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(ARTICLES, null, 2) });
    if(!r.ok) throw new Error('save failed');
    // 保存成功：恢复持久化能力，隐藏警告
    saveFailed = false;
    $('#banner').style.display = 'none';
  } catch(e){
    saveFailed = true;
    $('#banner').style.display = 'block';
    toast('保存失败：请确认通过本地服务打开');
  }
}

async function add(){
  const title = $('#inTitle').value.trim();
  let url = $('#inUrl').value.trim();
  if(!url){ toast('请输入 URL'); return; }
  if(!/^https?:\/\//i.test(url)) url='https://'+url;
  const priority = $('#inPri').value;
  // 先乐观插入内存并渲染，保证即时可见
  const tmp = { id: Date.now(), pos: 1e9, title, url, priority, done:false };
  ARTICLES.unshift(tmp);
  render();
  $('#inTitle').value=''; $('#inUrl').value=''; $('#inUrl').focus();
  // 走增量接口落库（不依赖整体 PUT）
  try {
    const r = await fetch('/api/candidate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ url, title, priority }) });
    if(!r.ok) throw new Error('add failed');
    const j = await r.json();
    // 用服务端返回的正式记录替换临时记录（拿到真实 id/pos）
    const rec = j.record;
    if (rec) {
      const idx = ARTICLES.findIndex(a => a === tmp);
      if (idx >= 0) ARTICLES[idx] = rec;
      render();
    }
    $('#banner').style.display='none';
    saveFailed = false;
  } catch(e){
    // 落库失败：保留内存显示，提示用户
    saveFailed = true;
    $('#banner').style.display='block';
    toast('添加失败：请确认通过本地服务打开');
  }
}

async function remove(i){
  ARTICLES.splice(i,1); render(); await persist();
}

$('#addBtn').onclick = add;
$('#inUrl').addEventListener('keydown', e=>{ if(e.key==='Enter') add(); });
$('#inTitle').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#inUrl').focus(); });
$('#sortSel').onchange = render;

(async ()=>{
  try {
    const r = await fetch('/api/articles', { cache:'no-store' });
    if(!r.ok) throw new Error();
    ARTICLES = await r.json();
    canPersist = true;
  } catch(e){
    // 初始化读取失败：仍允许后续添加并保存，仅提示
    canPersist = true;
    saveFailed = true;
    $('#banner').style.display = 'block';
    ARTICLES = ARTICLES || [];
  }
  render();
})();
</script>
</body>
</html>
