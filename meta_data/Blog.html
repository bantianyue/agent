<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog</title>
<style>
  :root {
    --bg:#f4f6f9; --card:#ffffff; --card2:#f7f9fc; --line:#e6eaf0;
    --txt:#1f2733; --muted:#8a94a3; --accent:#3b82f6; --accent2:#6366f1;
    --hi:#ef4444; --mid:#f59e0b; --low:#10b981; --ok:#22c55e; --warn:#f97316;
    --chip:#eef2ff;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--txt); min-height:100vh;
  }
  .wrap { max-width:1080px; margin:0 auto; padding:28px 18px 80px; }
  h1 {
    font-size:25px; margin:0 0 4px; font-weight:700; color:var(--txt);
  }
  .sub { font-size:13px; color:var(--muted); margin-bottom:18px; }
  .addbar {
    display:flex; gap:8px; flex-wrap:wrap; background:var(--card); padding:14px;
    border:1px solid var(--line); border-radius:14px; box-shadow:0 1px 3px rgba(20,30,50,.04);
  }
  .addbar input {
    flex:1; min-width:140px; padding:10px 12px; border:1px solid var(--line);
    border-radius:9px; font-size:14px; background:var(--card2); color:var(--txt); outline:none;
  }
  .addbar input:focus { border-color:var(--accent); }
  .addbar select { padding:10px 8px; border:1px solid var(--line); border-radius:9px; font-size:14px; background:var(--card2); color:var(--txt); }
  .addbar button {
    padding:10px 20px; border:0; border-radius:9px; background:var(--accent);
    color:#fff; font-size:14px; font-weight:600; cursor:pointer; transition:.15s;
  }
  .addbar button:hover { filter:brightness(1.05); }
  .toolbar { display:flex; gap:12px; align-items:center; margin:16px 0 8px; font-size:13px; color:var(--muted); flex-wrap:wrap; }
  .toolbar select { padding:6px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:var(--card2); color:var(--txt); }
  .toolbar button {
    padding:6px 12px; border:1px solid var(--line); border-radius:8px; font-size:13px;
    background:var(--card2); color:var(--txt); cursor:pointer;
  }
  .toolbar button:hover { border-color:var(--accent); }
  ul.list { list-style:none; margin:10px 0 0; padding:0; }
  li.item {
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:9px 12px; margin-bottom:7px; transition:.15s;
  }
  li.item:hover { border-color:#cfd6e0; box-shadow:0 2px 10px rgba(20,30,50,.06); }
  li.item.done { opacity:.5; }
  .row { display:flex; align-items:center; gap:10px; }
  .row1 { display:flex; align-items:center; gap:10px; }
  .item .pri { flex:none; }
  .item .pri select { padding:5px 8px; border:1px solid var(--line); border-radius:7px; font-size:12px; background:var(--card2); color:var(--txt); }
  .item .main { flex:1 1 260px; min-width:0; display:flex; flex-direction:column; }
  .item .t {
    font-size:14px; font-weight:600; word-break:break-word; color:var(--txt);
    border:1px solid transparent; border-radius:6px; padding:1px 4px; min-height:22px; cursor:text;
  }
  .item .t:hover { border-color:var(--line); background:var(--card2); }
  .item .t[contenteditable="true"]:focus { border-color:var(--accent); background:#fff; outline:none; }
  .item .u {
    font-size:12px; color:var(--muted); text-decoration:none; display:block;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  .item .u:hover { color:var(--accent); }
  .item .status { flex:none; }
  .item .status select { padding:5px 8px; border:1px solid var(--line); border-radius:7px; font-size:12px; background:var(--card2); color:var(--txt); }
  .item .note {
    flex:0 1 64px; min-width:60px; padding:5px 6px; border:1px solid var(--line); border-radius:7px;
    font-size:12px; background:var(--card2); color:var(--txt); height:30px; outline:none;
  }
  .item .note:focus { border-color:var(--accent); background:#fff; }
  .item .ts {
    flex:none; width:140px; display:flex; flex-direction:column; justify-content:center; align-items:center;
    line-height:1.5; font-size:11px; color:var(--muted); gap:2px;
  }
  .item .ts .ca { text-align:center; }
  .item .ts .ua { text-align:center; }
  .item .run {
    flex:none; width:34px; height:30px; border:1px solid var(--line); border-radius:7px;
    background:var(--card2); color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .item .run:hover { border-color:var(--accent2); color:var(--accent2); }
  .item .save {
    flex:none; width:34px; height:30px; border:0; border-radius:7px; background:var(--ok); color:#fff;
    cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .item .save:hover { filter:brightness(1.05); }
  .item .save.saved { background:var(--accent); }
  .item .copy { flex:none; width:30px; height:30px; border:1px solid var(--line); border-radius:7px; background:var(--card2); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .item .copy:hover { color:var(--accent); border-color:var(--accent); }
  .item .del { flex:none; width:28px; height:28px; border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }
  .item .del:hover { color:var(--hi); }
  .toast { position:fixed; left:50%; bottom:32px; transform:translateX(-50%); background:#1f2733; color:#fff; padding:9px 18px; border-radius:9px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .count { font-size:13px; color:var(--muted); margin-left:8px; font-weight:400; }
  .banner { background:#fff7e6; border:1px solid #ffd591; color:#ad6800; font-size:13px; padding:9px 13px; border-radius:9px; margin-bottom:14px; display:none; }
  .p-high { color:var(--hi); font-weight:600; }
  .p-mid { color:var(--mid); }
  .p-low { color:var(--low); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Blog <span class="count" id="count"></span></h1>
  <div class="sub">技术文章收藏 · 支持备注 / 状态 / 逐行保存</div>
  <div class="banner" id="banner">未通过本地服务打开，修改的数据不会保存。请用 server.py 启动后访问。</div>
  <div class="addbar">
    <input class="title" id="inTitle" placeholder="标题（可留空，自动取域名）">
    <input class="url" id="inUrl" placeholder="URL，例如 https://...">
    <select id="inPri" title="优先级">
      <option value="high">高</option>
      <option value="mid" selected>中</option>
      <option value="low">低</option>
    </select>
    <button id="addBtn">添加</button>
  </div>
  <div class="toolbar">
    <span>排序：</span>
    <select id="sortSel">
      <option value="time" selected>按添加顺序（新→旧）</option>
      <option value="pri">按优先级</option>
      <option value="status">按状态</option>
    </select>
    <button id="statusBtn">管理状态</button>
    <span id="stats"></span>
  </div>
  <ul class="list" id="list"></ul>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const list = $('#list');
let ARTICLES = [];
let STATUSES = [];
let canPersist = true;
let saveFailed = false;
const PRI_RANK = { high:0, mid:1, low:2 };
const STATUS_RANK = {};

function hostOf(url){ try { return new URL(url).hostname.replace(/^www\./,''); } catch { return url; } }
function priLabel(p){ return p==='high'?'高':p==='low'?'低':'中'; }

function render(){
  list.innerHTML = '';
  $('#count').textContent = ARTICLES.length ? `共 ${ARTICLES.length} 条` : '';
  const doneCnt = ARTICLES.filter(a=>a.status==='完成').length;
  $('#stats').textContent = `完成 ${doneCnt} / 未完成 ${ARTICLES.length-doneCnt}`;
  const sort = $('#sortSel').value;
  let arr = ARTICLES.slice();
  if (sort==='pri') arr.sort((a,b)=> (PRI_RANK[a.priority]??1)-(PRI_RANK[b.priority]??1) || (ARTICLES.indexOf(b)-ARTICLES.indexOf(a)));
  else if (sort==='status') arr.sort((a,b)=> ((STATUS_RANK[a.status]??99)-(STATUS_RANK[b.status]??99)) || (b.pos??0)-(a.pos??0));
  else if (sort==='time') arr.sort((a,b)=> (b.id??0)-(a.id??0));
  arr.forEach(a => {
    const idx = ARTICLES.indexOf(a);
    const li = document.createElement('li'); li.className = 'item' + (a.status==='完成'?' done':'');
    const row = document.createElement('div'); row.className = 'row';
    // 优先级
    const pri = document.createElement('div'); pri.className='pri';
    const sel = document.createElement('select'); sel.title='优先级';
    [['high','高'],['mid','中'],['low','低']].forEach(([v,t])=>{ const o=document.createElement('option'); o.value=v; o.textContent=t; if((a.priority||'mid')===v)o.selected=true; sel.appendChild(o); });
    sel.onchange = () => { a.priority = sel.value; markDirty(li); };
    pri.appendChild(sel); row.appendChild(pri);
    // 主体：title 可编辑 + url
    const main = document.createElement('div'); main.className = 'main';
    const t = document.createElement('div'); t.className='t'; t.contentEditable='true'; t.spellcheck=false;
    t.textContent = a.title || hostOf(a.url); t.title='点击编辑标题';
    t.addEventListener('blur', ()=>{ a.title = t.textContent.trim(); markDirty(li); });
    t.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); t.blur(); } });
    const ua = document.createElement('a'); ua.className='u'; ua.href=a.url; ua.target='_blank'; ua.rel='noopener'; ua.textContent=a.url; ua.title=a.url;
    main.appendChild(t); main.appendChild(ua); row.appendChild(main);
    // 状态
    const st = document.createElement('div'); st.className='status';
    const stsel = document.createElement('select'); stsel.title='状态';
    STATUSES.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; if((a.status||'未开始')===s)o.selected=true; stsel.appendChild(o); });
    stsel.onchange = () => { a.status = stsel.value; a.done = (a.status==='完成'); markDirty(li); renderStats(); };
    st.appendChild(stsel); row.appendChild(st);
    // 时间：上下创建/修改时间
    const ts = document.createElement('div'); ts.className='ts';
    const ca = document.createElement('span'); ca.className='ca'; ca.textContent = a.created_at || '2026-07-17 00:00:00'; ca.title='创建时间';
    const uaTs = document.createElement('span'); uaTs.className='ua'; uaTs.textContent = a.updated_at || '2026-07-17 00:00:00'; uaTs.title='修改时间';
    ts.appendChild(ca); ts.appendChild(uaTs); row.appendChild(ts);
    // 备注
    const note = document.createElement('input'); note.className='note'; note.type='text'; note.placeholder='备注…'; note.value=a.note||'';
    note.title='备注（可编辑）';
    note.oninput = () => { a.note = note.value; markDirty(li); };
    row.appendChild(note);
    // Run 按钮（暂不做任何事）
    const run = document.createElement('button'); run.className='run'; run.title='Run（功能待实现）';
    run.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    run.onclick = () => { toast('Run 功能待实现'); };
    row.appendChild(run);
    // 保存
    const save = document.createElement('button'); save.className='save'; save.title='保存'; save.dataset.dirty='0';
    save.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>';
    save.onclick = () => { a.title = (t.textContent.trim())||hostOf(a.url); saveOne(idx, save); };
    row.appendChild(save);
    // 复制
    const copy = document.createElement('button'); copy.className='copy'; copy.title='复制 URL';
    copy.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    copy.onclick = () => copyUrl(a.url);
    row.appendChild(copy);
    // 删除
    const del = document.createElement('button'); del.className='del'; del.title='删除'; del.textContent='×';
    del.onclick = () => remove(idx);
    row.appendChild(del);
    li.appendChild(row);
    list.appendChild(li);
  });
}

function renderStats(){
  const doneCnt = ARTICLES.filter(a=>a.status==='完成').length;
  $('#stats').textContent = `完成 ${doneCnt} / 未完成 ${ARTICLES.length-doneCnt}`;
}
function markDirty(li){ const b=li.querySelector('.save'); if(b){ b.dataset.dirty='1'; } }

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1500); }

function copyUrl(url){
  navigator.clipboard.writeText(url).then(()=>toast('已复制 URL')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('已复制 URL');
  });
}

async function saveOne(idx, btn){
  if(!canPersist){ toast('未连接本地服务'); return; }
  const a = ARTICLES[idx];
  if(!a){ return; }
  // 整体 PUT 保存（含该条最新值）
  try {
    const r = await fetch('/api/articles', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(ARTICLES, null, 2) });
    if(!r.ok) throw new Error('save failed');
    saveFailed = false; $('#banner').style.display='none';
    if(btn){ btn.dataset.dirty='0'; btn.classList.add('saved'); setTimeout(()=>{ btn.classList.remove('saved'); },1200); }
    toast('已保存');
  } catch(e){
    saveFailed = true; $('#banner').style.display='block';
    toast('保存失败：请确认通过本地服务打开');
  }
}

async function persist(){
  if(!canPersist) return;
  try {
    const r = await fetch('/api/articles', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(ARTICLES, null, 2) });
    if(!r.ok) throw new Error('save failed');
    saveFailed = false; $('#banner').style.display='none';
  } catch(e){
    saveFailed = true; $('#banner').style.display='block';
    toast('保存失败：请确认通过本地服务打开');
  }
}

async function add(){
  const title = $('#inTitle').value.trim();
  let url = $('#inUrl').value.trim();
  if(!url){ toast('请输入 URL'); return; }
  if(!/^https?:\/\//i.test(url)) url='https://'+url;
  const priority = $('#inPri').value;
  const tmp = { id: Date.now(), pos: 1e9, title, url, priority, done:false, note:'', status:'未开始' };
  ARTICLES.unshift(tmp);
  render();
  $('#inTitle').value=''; $('#inUrl').value=''; $('#inUrl').focus();
  try {
    const r = await fetch('/api/candidate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ url, title, priority }) });
    if(!r.ok) throw new Error('add failed');
    const j = await r.json();
    const rec = j.record;
    if (rec) {
      const i = ARTICLES.findIndex(a => a === tmp);
      if (i >= 0) ARTICLES[i] = rec;
      render();
    }
    $('#banner').style.display='none';
    saveFailed = false;
  } catch(e){
    saveFailed = true; $('#banner').style.display='block';
    toast('添加失败：请确认通过本地服务打开');
  }
}

async function remove(i){
  const a = ARTICLES[i];
  if(!a) return;
  if(!confirm(`确定删除「${a.title || a.url}」？`)) return;
  try {
    const r = await fetch(`/api/articles/${a.id}`, { method:'DELETE' });
    if(!r.ok) throw new Error('delete failed');
    await loadArticles();
    toast('已删除');
  } catch(e){
    toast('删除失败');
  }
}

// 状态管理弹窗
function manageStatuses(){
  const cur = STATUSES.join('、');
  const input = prompt('编辑状态（用 / 分隔多个，例如：未开始/完成/失败/搁置）：', cur);
  if(input===null) return;
  const wanted = input.split('/').map(s=>s.trim()).filter(Boolean);
  if(!wanted.length) return;
  (async ()=>{
    // 把当前多余的状态改名/新增：策略——逐个确保存在；不支持删除（保留历史数据）
    for(const w of wanted){
      if(!STATUSES.includes(w)){
        try{
          await fetch('/api/statuses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:w})});
        }catch(e){}
      }
    }
    await loadStatuses();
    render();
    toast('状态已更新');
  })();
}

async function loadStatuses(){
  try{
    const r = await fetch('/api/statuses',{cache:'no-store'});
    if(r.ok){ STATUSES = await r.json(); STATUSES = STATUSES.length?STATUSES:['未开始','完成','失败']; }
  }catch(e){ STATUSES = STATUSES.length?STATUSES:['未开始','完成','失败']; }
  STATUSES.forEach((s,i)=>{ STATUS_RANK[s]=i; });
}

$('#addBtn').onclick = add;
$('#inUrl').addEventListener('keydown', e=>{ if(e.key==='Enter') add(); });
$('#inTitle').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#inUrl').focus(); });
$('#sortSel').onchange = render;
$('#statusBtn').onclick = manageStatuses;

async function loadArticles(){
  try {
    const r = await fetch('/api/articles', { cache:'no-store' });
    if(!r.ok) throw new Error();
    ARTICLES = await r.json();
    canPersist = true;
  } catch(e){
    canPersist = true; saveFailed = true; $('#banner').style.display='block';
    ARTICLES = ARTICLES || [];
  }
  render();
}

(async ()=>{
  await loadStatuses();
  await loadArticles();
})();
</script>
</body>
</html>
