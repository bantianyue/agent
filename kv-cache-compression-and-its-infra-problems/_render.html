<svg viewBox="0 0 900 324" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kg2-fig-title kg2-fig-desc">
  <title id="kg2-fig-title">KV cache growth consuming GPU memory (schematic)</title>
  <desc id="kg2-fig-desc">A horizontal bar represents GPU memory, schematic and not to scale. A fixed segment of about one third holds model weights plus runtime; the remaining two thirds fills with the growing KV cache until it reaches a dashed out-of-memory line at the bar's right end. Below the bar, an LLM box emits output tokens into a history box aligned directly under the KV cache segment; the history fills with token squares one by one, and with each new token the KV cache segment above extends in sync.</desc>
  <style>
    .kg2-root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .kg2-title { font-size: 15px; fill: #111827; font-weight: 800; }
    .kg2-label { font-size: 13px; fill: #374151; }
    .kg2-small { font-size: 11px; fill: #667085; }
    .kg2-bar-label { font-size: 13px; font-weight: 700; }
    /* One synchronized 14s timeline; all stagger is baked into keyframe percentages.
       Fill phase 6%..60% in 12 discrete steps (one per token), then a 40%
       final-state hold before a simultaneous wrap. Base attrs = final state. */
    @keyframes kg2Grow {
      0%, 6%    { width: 0px; animation-timing-function: steps(12, end); }
      60%, 100% { width: 520px; }
    }
    .kg2-kv { animation: kg2Grow 14s linear infinite; }
    /* KV segment label fades in once the grown segment covers it; base = visible. */
    @keyframes kg2Label {
      0%, 33%   { opacity: 0; }
      41%, 100% { opacity: 1; }
    }
    .kg2-kv-label { animation: kg2Label 14s linear infinite; }
    /* History tokens pop in one per step, exactly at the KV bar's step jumps
       (10.5%, 15%, ... 60%). Base = visible (final state). */
    @keyframes kg2T1  { 0%,  9.5% { opacity: 0; } 10.5%, 100% { opacity: 1; } }
    @keyframes kg2T2  { 0%, 14%   { opacity: 0; } 15%,   100% { opacity: 1; } }
    @keyframes kg2T3  { 0%, 18.5% { opacity: 0; } 19.5%, 100% { opacity: 1; } }
    @keyframes kg2T4  { 0%, 23%   { opacity: 0; } 24%,   100% { opacity: 1; } }
    @keyframes kg2T5  { 0%, 27.5% { opacity: 0; } 28.5%, 100% { opacity: 1; } }
    @keyframes kg2T6  { 0%, 32%   { opacity: 0; } 33%,   100% { opacity: 1; } }
    @keyframes kg2T7  { 0%, 36.5% { opacity: 0; } 37.5%, 100% { opacity: 1; } }
    @keyframes kg2T8  { 0%, 41%   { opacity: 0; } 42%,   100% { opacity: 1; } }
    @keyframes kg2T9  { 0%, 45.5% { opacity: 0; } 46.5%, 100% { opacity: 1; } }
    @keyframes kg2T10 { 0%, 50%   { opacity: 0; } 51%,   100% { opacity: 1; } }
    @keyframes kg2T11 { 0%, 54.5% { opacity: 0; } 55.5%, 100% { opacity: 1; } }
    @keyframes kg2T12 { 0%, 59%   { opacity: 0; } 60%,   100% { opacity: 1; } }
    .kg2-t1  { animation: kg2T1  14s linear infinite; }
    .kg2-t2  { animation: kg2T2  14s linear infinite; }
    .kg2-t3  { animation: kg2T3  14s linear infinite; }
    .kg2-t4  { animation: kg2T4  14s linear infinite; }
    .kg2-t5  { animation: kg2T5  14s linear infinite; }
    .kg2-t6  { animation: kg2T6  14s linear infinite; }
    .kg2-t7  { animation: kg2T7  14s linear infinite; }
    .kg2-t8  { animation: kg2T8  14s linear infinite; }
    .kg2-t9  { animation: kg2T9  14s linear infinite; }
    .kg2-t10 { animation: kg2T10 14s linear infinite; }
    .kg2-t11 { animation: kg2T11 14s linear infinite; }
    .kg2-t12 { animation: kg2T12 14s linear infinite; }
    /* A small token travels LLM -> history four times during the fill phase.
       Final state = invisible at rest, matching base attrs. */
    @keyframes kg2Emit {
      0%, 6%    { opacity: 0; transform: translateX(0); }
      7.5%      { opacity: 1; transform: translateX(0); }
      17%       { opacity: 1; transform: translateX(96px); }
      18.5%     { opacity: 0; transform: translateX(96px); }
      19.5%     { opacity: 0; transform: translateX(0); }
      21%       { opacity: 1; transform: translateX(0); }
      30.5%     { opacity: 1; transform: translateX(96px); }
      32%       { opacity: 0; transform: translateX(96px); }
      33%       { opacity: 0; transform: translateX(0); }
      34.5%     { opacity: 1; transform: translateX(0); }
      44%       { opacity: 1; transform: translateX(96px); }
      45.5%     { opacity: 0; transform: translateX(96px); }
      46.5%     { opacity: 0; transform: translateX(0); }
      48%       { opacity: 1; transform: translateX(0); }
      57.5%     { opacity: 1; transform: translateX(96px); }
      59%       { opacity: 0; transform: translateX(96px); }
      60%, 100% { opacity: 0; transform: translateX(0); }
    }
    .kg2-emit { animation: kg2Emit 14s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .kg2-kv, .kg2-kv-label, .kg2-emit,
      .kg2-t1, .kg2-t2, .kg2-t3, .kg2-t4, .kg2-t5, .kg2-t6,
      .kg2-t7, .kg2-t8, .kg2-t9, .kg2-t10, .kg2-t11, .kg2-t12 { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="kg2-bar-clip"><rect x="60" y="56" width="780" height="64" rx="10"/></clipPath>
    <marker id="kg2-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <g class="kg2-root">
    <rect width="900" height="324" fill="#fff" rx="12"/>

    <text x="60" y="38" class="kg2-title">GPU memory</text>
    <text x="172" y="38" class="kg2-small">(schematic — not to scale)</text>

    <!-- Memory bar: weights + runtime is ~1/3, KV cache headroom is ~2/3 -->
    <rect x="60" y="56" width="780" height="64" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
    <g clip-path="url(#kg2-bar-clip)">
      <!-- Weights + runtime segment: fixed, ~1/3 of the bar -->
      <rect x="60" y="56" width="260" height="64" fill="#6b7280"/>
      <!-- KV cache segment (grows in token-sized steps); base width = full final state -->
      <rect class="kg2-kv" x="320" y="56" width="520" height="64" fill="#f59e0b"/>
    </g>
    <text x="190" y="84" class="kg2-bar-label" text-anchor="middle" fill="#f9fafb">Weights + runtime</text>
    <text x="190" y="104" class="kg2-small" text-anchor="middle" fill="#e5e7eb">(fixed)</text>
    <text class="kg2-bar-label kg2-kv-label" x="580" y="84" text-anchor="middle" fill="#78350f">KV cache</text>
    <text class="kg2-small kg2-kv-label" x="580" y="104" text-anchor="middle" fill="#78350f">grows with every generated token →</text>

    <!-- OOM limit line at the bar's right end, extended down past the history box -->
    <line x1="840" y1="42" x2="840" y2="256" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="848" y="72" style="font-size:13px; fill:#dc2626; font-weight:800;">OOM</text>

    <!-- Sync guide: history box left edge aligns with the KV segment start -->
    <line x1="320" y1="124" x2="320" y2="164" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="2 4"/>

    <!-- Explanatory row: the LLM emits tokens into the history (= the KV cache) -->
    <rect x="84" y="176" width="112" height="64" rx="10" fill="#1f2937"/>
    <text x="140" y="203" text-anchor="middle" style="font-size:15px; font-weight:800;" fill="#f9fafb">LLM</text>
    <text x="140" y="224" text-anchor="middle" class="kg2-small" fill="#d1d5db">generating…</text>

    <text x="254" y="192" class="kg2-small" text-anchor="middle">output tokens</text>
    <line x1="202" y1="208" x2="306" y2="208" stroke="#6b7280" stroke-width="1.8" marker-end="url(#kg2-arrowhead)"/>
    <rect class="kg2-emit" x="206" y="200" width="16" height="16" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1" opacity="0"/>

    <!-- History box, directly below the KV cache segment of the bar -->
    <rect x="320" y="168" width="520" height="80" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="332" y="190" style="font-size:13px; font-weight:700;" fill="#92400e">history</text>
    <text x="390" y="190" class="kg2-small" fill="#b45309">— every token's K/V stays here</text>
    <rect class="kg2-t1"  x="332"   y="204" width="30" height="30" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <rect class="kg2-t2"  x="374.4" y="204" width="30" height="30" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <rect class="kg2-t3"  x="416.8" y="204" width="30" height="30" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <rect class="kg2-t4"  x="459.2" y="204" width="30" height="30" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <rect class="kg2-t5"  x="501.6" y="204" width="30" height="30" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <rect class="kg2-t6"  x="544"   y="204" width="30" height="30" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <rect class="kg2-t7"  x="586.4" y="204" width="30" height="30" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <rect class="kg2-t8"  x="628.8" y="204" width="30" height="30" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <rect class="kg2-t9"  x="671.2" y="204" width="30" height="30" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <rect class="kg2-t10" x="713.6" y="204" width="30" height="30" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <rect class="kg2-t11" x="756"   y="204" width="30" height="30" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <rect class="kg2-t12" x="798.4" y="204" width="30" height="30" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>

    <!-- Punchline annotation -->
    <text x="450" y="288" class="kg2-label" text-anchor="middle">Every generated token appends its keys and values to the history — that history is the KV cache.</text>
    <text x="450" y="308" class="kg2-small" text-anchor="middle">Nothing is freed while generation continues, so long outputs march the bar into the OOM wall.</text>
  </g>
</svg><hr><svg viewBox="0 0 900 205" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sl-title sl-desc">
  <title id="sl-title">StreamingLLM: attention sinks plus a sliding window</title>
  <desc id="sl-desc">A row of tokens. The first two are attention sinks and are always kept. A window outline covers the four most recent tokens. As generation proceeds, new tokens appear on the right, the window slides forward, and tokens that fall out of it are evicted into dashed ghost slots. The sinks never move and are never evicted.</desc>
  <style>
    .sl-root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .sl-title-txt { font-size: 14px; fill: #111827; font-weight: 800; text-anchor: middle; }
    .sl-small { font-size: 10px; fill: #6b7280; text-anchor: middle; }
    .sl-keep { font-size: 10px; fill: #166534; font-weight: 700; text-anchor: middle; }
    .sl-lbl { font-size: 12px; fill: #374151; }
    /* Seven static window brackets, one per position; only opacity animates,
       on the same 2% transition windows as the token keyframes — no transforms,
       so no drift. Base attributes = final state (position 7 visible). */
    .sl-w1 { animation: slW1 12s linear infinite; } @keyframes slW1 { 0%,10% {opacity:1;} 12%,100% {opacity:0;} }
    .sl-w2 { animation: slW2 12s linear infinite; } @keyframes slW2 { 0%,10% {opacity:0;} 12%,20% {opacity:1;} 22%,100% {opacity:0;} }
    .sl-w3 { animation: slW3 12s linear infinite; } @keyframes slW3 { 0%,20% {opacity:0;} 22%,30% {opacity:1;} 32%,100% {opacity:0;} }
    .sl-w4 { animation: slW4 12s linear infinite; } @keyframes slW4 { 0%,30% {opacity:0;} 32%,40% {opacity:1;} 42%,100% {opacity:0;} }
    .sl-w5 { animation: slW5 12s linear infinite; } @keyframes slW5 { 0%,40% {opacity:0;} 42%,50% {opacity:1;} 52%,100% {opacity:0;} }
    .sl-w6 { animation: slW6 12s linear infinite; } @keyframes slW6 { 0%,50% {opacity:0;} 52%,60% {opacity:1;} 62%,100% {opacity:0;} }
    .sl-w7 { animation: slW7 12s linear infinite; } @keyframes slW7 { 0%,60% {opacity:0;} 62%,100% {opacity:1;} }
    /* Tokens 6-11 are generated one per step; base = visible (final state). */
    .sl-b6 { animation: slB6 12s linear infinite; } @keyframes slB6 { 0%,10% {opacity:0;} 12%,100% {opacity:1;} }
    .sl-b7 { animation: slB7 12s linear infinite; } @keyframes slB7 { 0%,20% {opacity:0;} 22%,100% {opacity:1;} }
    .sl-b8 { animation: slB8 12s linear infinite; } @keyframes slB8 { 0%,30% {opacity:0;} 32%,100% {opacity:1;} }
    .sl-b9 { animation: slB9 12s linear infinite; } @keyframes slB9 { 0%,40% {opacity:0;} 42%,100% {opacity:1;} }
    .sl-b10 { animation: slB10 12s linear infinite; } @keyframes slB10 { 0%,50% {opacity:0;} 52%,100% {opacity:1;} }
    .sl-b11 { animation: slB11 12s linear infinite; } @keyframes slB11 { 0%,60% {opacity:0;} 62%,100% {opacity:1;} }
    /* Blue "live" overlay fades out when the window moves past; base = ghost (final). */
    .sl-g2 { animation: slG2 12s linear infinite; } @keyframes slG2 { 0%,10% {opacity:1;} 12%,100% {opacity:0;} }
    .sl-g3 { animation: slG3 12s linear infinite; } @keyframes slG3 { 0%,20% {opacity:1;} 22%,100% {opacity:0;} }
    .sl-g4 { animation: slG4 12s linear infinite; } @keyframes slG4 { 0%,30% {opacity:1;} 32%,100% {opacity:0;} }
    .sl-g5 { animation: slG5 12s linear infinite; } @keyframes slG5 { 0%,40% {opacity:1;} 42%,100% {opacity:0;} }
    .sl-g6 { animation: slG6 12s linear infinite; } @keyframes slG6 { 0%,50% {opacity:1;} 52%,100% {opacity:0;} }
    .sl-g7 { animation: slG7 12s linear infinite; } @keyframes slG7 { 0%,60% {opacity:1;} 62%,100% {opacity:0;} }
    @media (prefers-reduced-motion: reduce) {
      .sl-w1, .sl-w2, .sl-w3, .sl-w4, .sl-w5, .sl-w6, .sl-w7,
      .sl-b6, .sl-b7, .sl-b8, .sl-b9, .sl-b10, .sl-b11,
      .sl-g2, .sl-g3, .sl-g4, .sl-g5, .sl-g6, .sl-g7 { animation: none; }
    }
  </style>
  <g class="sl-root">
    <rect width="900" height="205" fill="#fff" rx="12"/>
    <text x="450" y="26" class="sl-title-txt">StreamingLLM — keep the sinks, keep a sliding window, evict the rest</text>
    <text x="450" y="44" class="sl-small">← oldest&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;token sequence grows during generation&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;newest →</text>

    <g class="sl-b6">
      <rect x="462" y="88" width="52" height="28" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="3 2"/>
      <rect class="sl-g6" x="462" y="88" width="52" height="28" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8" opacity="0"/>
    </g>
    <g class="sl-b7">
      <rect x="534" y="88" width="52" height="28" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="3 2"/>
      <rect class="sl-g7" x="534" y="88" width="52" height="28" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8" opacity="0"/>
    </g>
    <!-- Tokens 8-11: in window at rest -->
    <g class="sl-b8"><rect x="606" y="88" width="52" height="28" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/></g>
    <g class="sl-b9"><rect x="678" y="88" width="52" height="28" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/></g>

    <!-- Sliding window brackets: one static group per position, opacity cross-fades -->

</svg><hr><svg viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="h2-title h2-desc">
  <title id="h2-title">H2O: cumulative historical attention scoring</title>
  <desc id="h2-desc">A query box at the top attends to eight cached tokens. With each decode step, every token's score bar grows by the attention it just received. After several steps, tokens with high cumulative scores are kept; tokens with low scores are evicted into dashed ghost slots.</desc>
  <style>
    .h2-root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .h2-title-txt { font-size: 14px; fill: #111827; font-weight: 800; text-anchor: middle; }
    .h2-small { font-size: 10px; fill: #6b7280; text-anchor: middle; }

  <title id="cp2-title">Order-preserving repack: survivors slide forward, one whole block is freed</title>
  <desc id="cp2-desc">Six memory blocks of four slots each. B1 to B5 hold the past context, tokens T0 through T19, every slot full; B6 receives the current round's newly generated tokens T20 to T23, standing in for about 128 decoded tokens. Scoring evicts T2, T9 and T13 from the history and T21 from the new round, leaving dashed empty frames. Every surviving token then slides forward to close the holes while keeping its original order, so B1 to B5 end up holding T0, T1, T3, T4, then T5 to T8, then T10, T11, T12, T14, then T15 to T18, then T19, T20, T22, T23 — and B6 ends up completely empty and is returned to the allocator as a freed block.</desc>
  <style>
    .cp2-root  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .cp2-ttl   { font-size: 14px; fill: #111827; font-weight: 800; text-anchor: middle; }
    .cp2-sm    { font-size: 11px; fill: #667085; text-anchor: middle; }
    .cp2-lg    { font-size: 12px; fill: #374151; }
    .cp2-tok   { font-size: 10px; fill: #fff; font-weight: 700; text-anchor: middle; }
    .cp2-cap   { font-size: 13px; fill: #374151; font-weight: 650; text-anchor: middle; }
    /* Story (16s cycle, 1% = 0.16s), four phases narrated by the caption
       lines at the bottom:
         P1 generation 0-16%   : B6's chips fade in one by one
         P2 scoring   16-30%   : 4 evicted chips fade out, ghost frames fade in
         P3 repack    30-57%   : survivors close the holes in a left-to-right
                                 wave, original order preserved; ghosts vanish
                                 as their slot is re-occupied
         P4 free      57-63%   : B6's block dissolves into its freed state
       then everything holds the final state until 100% (37% hold).
       Discipline: ALL positional movement is SVG-native SMIL
       (animateTransform type="translate" in user units on each mover g,
       immune to the CSS-px vs user-unit scaling drift some engines show on
       scaled SVGs); this CSS keeps only opacity work. Every animation, CSS
       and SMIL alike, shares the one 16s cycle with begin 0s, so the loop
       wrap is a single simultaneous snap. SMIL values arrays run
       initial -> hold -> move -> final-hold with the same percentage windows
       the old transform keyframes used.
       Base attributes = final state (static / reduced-motion view is the
       finished repack with B6 freed). */
    /* P1 — the new round's three survivors fade in at B6 (movement is SMIL). */
    @keyframes cp2N1 { 0%        { opacity: 0; } 3%, 100%    { opacity: 1; } }
    @keyframes cp2N3 { 0%, 7%    { opacity: 0; } 10%, 100%   { opacity: 1; } }
    @keyframes cp2N4 { 0%, 10.5% { opacity: 0; } 13.5%, 100% { opacity: 1; } }
    /* P1+P2 — the new round's evictee: fades in second, fades out at scoring. */
    @keyframes cp2N2 {
      0%, 3.5%    { opacity: 0; }
      6.5%, 18%   { opacity: 1; }
      24%, 100%   { opacity: 0; }
    }
    /* P2 — the three history evictees fade out together at scoring. */
    @keyframes cp2Evict { 0%, 18% { opacity: 1; } 24%, 100% { opacity: 0; } }
    /* Ghost frames: in at scoring, out when their slot is re-occupied
       (G1 by T3 at stage 1, G2 by T11 at stage 3, G3 by T16 at stage 5)
       or, for B6's ghost, when the whole block is freed. */
    @keyframes cp2G1 { 0%, 18% { opacity: 0; } 24%, 30% { opacity: 0.9; } 34%, 100% { opacity: 0; } }
    @keyframes cp2G2 { 0%, 18% { opacity: 0; } 24%, 38% { opacity: 0.9; } 42%, 100% { opacity: 0; } }
    @keyframes cp2G3 { 0%, 18% { opacity: 0; } 24%, 46% { opacity: 0.9; } 50%, 100% { opacity: 0; } }
    @keyframes cp2G4 { 0%, 18% { opacity: 0; } 24%, 57% { opacity: 0.9; } 63%, 100% { opacity: 0; } }
    /* P4 — B6 cross-fades from a live block into its freed state. */
    @keyframes cp2B6    { 0%, 57% { opacity: 1; } 63%, 100% { opacity: 0; } }
    @keyframes cp2Freed { 0%, 57% { opacity: 0; } 63%, 100% { opacity: 1; } }
    /* Caption lines, cross-faded in sync with the phases. */
    @keyframes cp2Cap1 { 0%, 14% { opacity: 1; } 16%, 100% { opacity: 0; } }
    @keyframes cp2Cap2 { 0%, 16% { opacity: 0; } 18%, 28% { opacity: 1; } 30%, 100% { opacity: 0; } }
    @keyframes cp2Cap3 { 0%, 30% { opacity: 0; } 32%, 55% { opacity: 1; } 57%, 100% { opacity: 0; } }
    @keyframes cp2Cap4 { 0%, 57% { opacity: 0; } 59%, 100% { opacity: 1; } }
    /* (the .cp2-w* wave classes carry no CSS animation: their movement is
       the SMIL animateTransform inside each mover g; the class names remain
       as wave-stage labels matching the audit table) */
    .cp2-n1  { animation: cp2N1  16s ease-in-out infinite; }
    .cp2-n2  { animation: cp2N2  16s ease-in-out infinite; }
    .cp2-n3  { animation: cp2N3  16s ease-in-out infinite; }
    .cp2-n4  { animation: cp2N4  16s ease-in-out infinite; }
    .cp2-ev  { animation: cp2Evict 16s ease-in-out infinite; }
    .cp2-g1  { animation: cp2G1 16s ease-in-out infinite; }
    .cp2-g2  { animation: cp2G2 16s ease-in-out infinite; }
    .cp2-g3  { animation: cp2G3 16s ease-in-out infinite; }
    .cp2-g4  { animation: cp2G4 16s ease-in-out infinite; }
    .cp2-b6  { animation: cp2B6 16s ease-in-out infinite; }
    .cp2-b6f { animation: cp2Freed 16s ease-in-out infinite; }
    .cp2-c1  { animation: cp2Cap1 16s ease-in-out infinite; }
    .cp2-c2  { animation: cp2Cap2 16s ease-in-out infinite; }
    .cp2-c3  { animation: cp2Cap3 16s ease-in-out infinite; }
    .cp2-c4  { animation: cp2Cap4 16s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .cp2-n1, .cp2-n2, .cp2-n3, .cp2-n4,
      .cp2-ev, .cp2-g1, .cp2-g2, .cp2-g3, .cp2-g4, .cp2-b6, .cp2-b6f,
      .cp2-c1, .cp2-c2, .cp2-c3, .cp2-c4 { animation: none; }
    }
  </style>

  <title id="fh2-title">Hole-filling: survivors stay put, the new round drops into the holes</title>
  <desc id="fh2-desc">Same six blocks and the same evictions as the previous figure: B1 to B5 hold tokens T0 through T19 with every slot full, B6 receives the current round's new tokens T20 to T23, and scoring evicts T2, T9, T13 and T21. This time the history survivors never move: the new round's three survivors T20, T22 and T23 drop directly into the three holes in B1, B3 and B4, so B1 ends up reading T0, T1, T20, T3 — dense but out of original order. B6 again ends up empty and is returned to the allocator as a freed block.</desc>
  <style>
    .fh2-root  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .fh2-ttl   { font-size: 14px; fill: #111827; font-weight: 800; text-anchor: middle; }
    .fh2-sm    { font-size: 11px; fill: #667085; text-anchor: middle; }
    .fh2-lg    { font-size: 12px; fill: #374151; }
    .fh2-tok   { font-size: 10px; fill: #fff; font-weight: 700; text-anchor: middle; }
    .fh2-cap   { font-size: 13px; fill: #374151; font-weight: 650; text-anchor: middle; }
    /* Story (14s cycle, 1% = 0.14s), same four phases as Figure 7 but with
       the minimal-movement strategy:
         P1 generation 0-16%   : B6's chips fade in one by one (same as Fig 7)
         P2 scoring   16-30%   : same 4 evictions, ghosts fade in
         P3 hole-fill 30-45%   : ONLY B6's three survivors travel, each
                                 straight into a hole; nothing else moves
         P4 free      47-53%   : B6 dissolves into its freed state
       then the final state holds until 100% (47% hold).
       Discipline: ALL positional movement is SVG-native SMIL
       (animateTransform type="translate" in user units on each mover g,
       immune to the CSS-px vs user-unit scaling drift some engines show on
       scaled SVGs); this CSS keeps only opacity work. Every animation, CSS
       and SMIL alike, shares the one 14s cycle with begin 0s, so the loop
       wrap is a single simultaneous snap. SMIL values arrays run
       initial -> hold -> move -> final-hold with the same percentage windows
       the old transform keyframes used.
       Base attributes = final state (static / reduced-motion view is the
       finished hole-fill with B6 freed). */
    /* P1 — the new round's three survivors fade in at B6 (movement is SMIL). */
    @keyframes fh2M1 { 0%        { opacity: 0; } 3%, 100%    { opacity: 1; } }
    @keyframes fh2M2 { 0%, 7%    { opacity: 0; } 10%, 100%   { opacity: 1; } }
    @keyframes fh2M3 { 0%, 10.5% { opacity: 0; } 13.5%, 100% { opacity: 1; } }
    @keyframes fh2N2 {
      0%, 3.5%    { opacity: 0; }

      24%, 100%   { opacity: 0; }
    }
    @keyframes fh2Evict { 0%, 18% { opacity: 1; } 24%, 100% { opacity: 0; } }
    /* Ghosts: in at scoring, out when their hole is filled (or B6 freed). */
    @keyframes fh2G1 { 0%, 18% { opacity: 0; } 24%, 31% { opacity: 0.9; } 37%, 100% { opacity: 0; } }
    @keyframes fh2G2 { 0%, 18% { opacity: 0; } 24%, 35% { opacity: 0.9; } 41%, 100% { opacity: 0; } }
    @keyframes fh2G3 { 0%, 18% { opacity: 0; } 24%, 39% { opacity: 0.9; } 45%, 100% { opacity: 0; } }
    @keyframes fh2G4 { 0%, 18% { opacity: 0; } 24%, 47% { opacity: 0.9; } 53%, 100% { opacity: 0; } }
    @keyframes fh2B6    { 0%, 47% { opacity: 1; } 53%, 100% { opacity: 0; } }
    @keyframes fh2Freed { 0%, 47% { opacity: 0; } 53%, 100% { opacity: 1; } }
    @keyframes fh2Cap1 { 0%, 14% { opacity: 1; } 16%, 100% { opacity: 0; } }
    @keyframes fh2Cap2 { 0%, 16% { opacity: 0; } 18%, 28% { opacity: 1; } 30%, 100% { opacity: 0; } }
    @keyframes fh2Cap3 { 0%, 30% { opacity: 0; } 32%, 45% { opacity: 1; } 47%, 100% { opacity: 0; } }
    @keyframes fh2Cap4 { 0%, 47% { opacity: 0; } 49%, 100% { opacity: 1; } }

    .fh2-m2  { animation: fh2M2 14s ease-in-out infinite; }
    .fh2-m3  { animation: fh2M3 14s ease-in-out infinite; }
    .fh2-n2  { animation: fh2N2 14s ease-in-out infinite; }
    .fh2-ev  { animation: fh2Evict 14s ease-in-out infinite; }
    .fh2-g1  { animation: fh2G1 14s ease-in-out infinite; }
    .fh2-g2  { animation: fh2G2 14s ease-in-out infinite; }
    .fh2-g3  { animation: fh2G3 14s ease-in-out infinite; }
    .fh2-g4  { animation: fh2G4 14s ease-in-out infinite; }
    .fh2-b6  { animation: fh2B6 14s ease-in-out infinite; }
    .fh2-b6f { animation: fh2Freed 14s ease-in-out infinite; }
    .fh2-c1  { animation: fh2Cap1 14s ease-in-out infinite; }
    .fh2-c2  { animation: fh2Cap2 14s ease-in-out infinite; }
    .fh2-c3  { animation: fh2Cap3 14s ease-in-out infinite; }
    .fh2-c4  { animation: fh2Cap4 14s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .fh2-m1, .fh2-m2, .fh2-m3, .fh2-n2, .fh2-ev,
      .fh2-g1, .fh2-g2, .fh2-g3, .fh2-g4, .fh2-b6, .fh2-b6f,
      .fh2-c1, .fh2-c2, .fh2-c3, .fh2-c4 { animation: none; }
    }
  </style>
