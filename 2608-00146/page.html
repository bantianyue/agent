ded-full p-3 text-text" data-state="closed"><div class="interactable-overlay bg-overlay"></div><svg width="18" height="18" viewBox="0 0 24 24" class="" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M23.643 4.937c-.835.37-1.732.62-2.675.733.962-.576 1.7-1.49 2.048-2.578-.9.534-1.897.922-2.958 1.13-.85-.904-2.06-1.47-3.4-1.47-2.572 0-4.658 2.086-4.658 4.66 0 .364.042.718.12 1.06-3.873-.195-7.304-2.05-9.602-4.868-.4.69-.63 1.49-.63 2.342 0 1.616.823 3.043 2.072 3.878-.764-.025-1.482-.234-2.11-.583v.06c0 2.257 1.605 4.14 3.737 4.568-.392.106-.803.162-1.227.162-.3 0-.593-.028-.877-.082.593 1.85 2.313 3.198 4.352 3.234-1.595 1.25-3.604 1.995-5.786 1.995-.376 0-.747-.022-1.112-.065 2.062 1.323 4.51 2.093 7.14 2.093 8.57 0 13.255-7.098 13.255-13.254 0-.2-.005-.402-.014-.602.91-.658 1.7-1.477 2.323-2.41z"></path></svg></a></div><div class="invisible flex overflow-hidden transition-opacity duration-200 lg:visible pointer-events-none opacity-0"><a href="/blog" class="w-fit p-3 text-xs whitespace-nowrap text-subtext hover:underline">Blog</a><a href="https://github.com/alphaxiv/feedback/issues" target="_blank" rel="noopener noreferrer" class="w-fit p-3 text-xs whitespace-nowrap text-subtext hover:underline">Send Feedback?</a></div></div></div></div><div class="min-h-0 w-full flex-auto flex-col sm:w-0"><!--$--><div class="h-dvh"><script data-alphaxiv-id="json-ld-paper-detail-view" type="application/ld+json">{"@context":"https://schema.org","@type":"ScholarlyArticle","headline":"DiffusionGemma Technical Report","abstract":"We introduce DiffusionGemma, an experimental open-weight language model that uses discrete diffusion to generate text at exceptionally high speed. Rather than decoding one token at a time, DiffusionGemma iteratively refines blocks of 256 tokens in parallel, avoiding the sequential decoding bottleneck of conventional autoregressive (AR) large language models. Instead of training from scratch, we obtain DiffusionGemma by fine-tuning the mixture-of-experts Gemma 4 model with 3.8B activated and 25.2B total parameters. Our compute-efficient two-stage training pipeline uses fewer than 10% of the starting AR model's total training token budget. The first stage uses supervised fine-tuning to teach bidirectional denoising, while the second stage combines reinforcement learning with sampler distillation to jointly improve generation quality and inference efficiency. DiffusionGemma establishes a new Pareto frontier for the trade-off between generation speed and model capability. Averaged across our full evaluation suite, it generates around 20 tokens per forward pass and achieves roughly 1,500 output tokens per second on a single NVIDIA H100 GPU, which is substantially faster than AR models even with state-of-the-art speculative decoding. DiffusionGemma also retains the starting model's support for thinking mode, multimodal inputs, and long contexts. Despite diffusion fine-tuning, it remains capable of AR generation with only minor performance degradation, suggesting a path toward hybrid diffusion-AR decoding.","author":[{"@type":"Person","name":"DiffusionGemma Team"},{"@type":"Person","name":"Adrien Ali Taïga"},{"@type":"Person","name":"James Assiene"},{"@type":"Person","name":"Daniele Calandriello"},{"@type":"Person","name":"Rahma Chaabouni"},{"@type":"Person","name":"João Gante"},{"@type":"Person","name":"Tamara von Glehn"},{"@type":"Person","name":"Nate Keating"},{"@type":"Person","name":"Chris Knutsen"},{"@type":"Person","name":"Martin Kukla"},{"@type":"Person","name":"Tianlin Liu"},{"@type":"Person","name":"Ivan Lobov"},{"@type":"Person","name":"Ofir Nabati"},{"@type":"Person","name":"João Gabriel Oliveira"},{"@type":"Person","name":"Nicolas Perez-Nieves"},{"@type":"Person","name":"Nastasia Prutianova"},{"@type":"Person","name":"Bobak Shahriari"},{"@type":"Person","name":"Jean Tarbouriech"},{"@type":"Person","name":"Pavel Tyletski"},{"@type":"Person","name":"Çağlar Ünlü"},{"@type":"Person","name":"Cindy Wu"},{ ters. Our compute-efficient two-stage training pipeline uses fewer than 10% of the starting AR model's total training token budget. The first stage uses supervised fine-tuning to teach bidirectional denoising, while the second stage combines reinforcement learning with sampler distillation to jointly improve generation quality and inference efficiency. DiffusionGemma establishes a new Pareto frontier for the trade-off between generation speed and model capability. Averaged across our full evaluation suite, it generates around 20 tokens per forward pass and achieves roughly 1,500 output tokens per second on a single NVIDIA H100 GPU, which is substantially faster than AR models even with state-of-the-art speculative decoding. DiffusionGemma also retains the starting model's support for thinking mode, multimodal inputs, and long contexts. Despite diffusion fine-tuning, it remains capable of AR generation with only minor performance degradation, suggesting a path toward hybrid diffusion-AR decoding.",publicationDate:$R[34],license:"http://creativecommons.org/licenses/by/4.0/",canonicalId:"2608.00146v1",blocked:!1,withdrawn:!1,withdrawalNotice:null,createdAt:"Tue Aug 04 2026 05:59:18 GMT+0000 (Coordinated Universal Time)",updatedAt:"Tue Aug 04 2026 05:59:18 GMT+0000 (Coordinated Universal Time)",authors:$R[66]=[$R[67]={full_name:"DiffusionGemma Team",researcher:null},$R[68]={full_name:"Adrien Ali Taïga",researcher:null},$R[69]={full_name:"James Assiene",researcher:null},$R[70]={full_name:"Daniele Calandriello",researcher:null},$R[71]={full_name:"Rahma Chaabouni",researcher:null},$R[72]={full_name:"João Gante",researcher:null},$R[73]={full_name:"Tamara von Glehn",researcher:null},$R[74]={full_name:"Nate Keating",researcher:null},$R[75]={full_name:"Chris Knutsen",researcher:null},$R[76]={full_name:"Martin Kukla",researcher:null},$R[77]={full_name:"Tianlin Liu",researcher:null},$R[78]={full_name:"Ivan Lobov",researcher:null},$R[79]={full_name:"Ofir Nabati",researcher:null}, },$R[112]={dehydratedAt:1785936439553,state:$R[113]={data:$R[114]={type:"public",groupId:"019fcb5a-e145-7fee-8b73-bf4c078cd51c",sourceName:"alphaXiv",sourceUrl:"https://arxiv.org/abs/2608.00146",citationBibtex:"@misc{diffusiongemmateam2026diffusiongemmatechnicalreport,\n      title={DiffusionGemma Technical Report}, \n      author={DiffusionGemma Team and Adrien Ali Taïga and James Assiene and Daniele Calandriello and Rahma Chaabouni and João Gante and Tamara von Glehn and Nate Keating and Chris Knutsen and Martin Kukla and Tianlin Liu and Ivan Lobov and Ofir Nabati and João Gabriel Oliveira and Nicolas Perez-Nieves and Nastasia Prutianova and Bobak Shahriari and Jean Tarbouriech and Pavel Tyletski and Çağlar Ünlü and Cindy Wu and Glenn Cameron and Jerome Connor and Sertan Girgin and Maarten Grootendorst and Alon Levkovitch and Eliya Nachmani and Omar Sanseviero and Piotr Stanczyk and Quentin Berthet and Andrew Campbell and Clément Crepy and Valentin De Bortoli and Arnaud Doucet and Romuald Elie and Alexandre Galashov and Klaus Greff and Alexis Jacq and David Ruhe and Yu-Han Wu and Sebastian Flennerhag and Brendan O'Donoghue and George Scrivener and Shantanu Thakoor},\n      year={2026},\n      eprint={2608.00146},\n      archivePrefix={arXiv},\n      primaryClass={cs.CL},\n      url={https://arxiv.org/abs/2608.00146}, \n}",citationsCount:null,googleCitationId:null,firstPublicationDate:$R[115]=new Date("2026-07-31T16:11:46.000Z"),resources:$R[116]=[],versions:$R[117]=[$R[118]={id:"019fcb5a-e1ad-71eb-9fa9-5d2b8204b99e",label:"v1",order:1,publicationDate:$R[119]=new Date("2026-07-31T16:11:46.000Z"),withdrawn:!1}],universalId:"2608.00146",maxVersionOrder:1,topics:$R[120]=["Computer Science","cs.AI","cs.CL","efficient-transformers","fine-tuning","generative-models","inference-optimization","multi-modal-learning","reinforcement-learning","sequence-modeling","text-generation","transformers"],metrics:$R[121]={commentsCount:0,totalVotes:8,publicTotalVotes:16,visitsCount:$R[122]={last24Hours:237,last7Days:254,last30Days:254,last90Days:254,all:254}},blocked:!1,pdfOnly:!1,createdAt:"Tue Aug 04 2026 05:59:18 GMT+0000 (Coordinated Universal Time)",updatedAt:"Tue Aug 04 2026 05:59:18 GMT+0000 (Coordinated Universal Time)",organizationInfo:$R[123]=[],verifiedAuthors:$R[124]=[],canSubmitNewVersion:!1,paperSummary:$R[125]={summary:"DiffusionGemma, developed by Google DeepMind's DiffusionGemma Team, introduces an open-weight language model that utilizes discrete diffusion for high-speed text generation. It achieves an average output speed of 1,500 tokens per second on a single NVIDIA H100 GPU, representing a 7.1x speed improvement over its autoregressive baseline, while maintaining competitive generation quality.",originalProblem:$R[126]=["Autoregressive language models face memory bottlenecks during inference, leading to under-utilized compute resources and slow per-user generation speeds, even with speculative decoding methods.","Existing text diffusion models are either proprietary, limiting accessibility, or open-weight alternatives often lack strong reasoning capabilities, multimodal understanding, or fail to deliver significant latency reductions.","There is a need for open-weight models that can combine high intelligence and speed without the compromises seen in current text diffusion solutions."],solution:$R[127]=["DiffusionGemma fine-tunes the Gemma 4 26B A4B Mixture-of-Experts model, adapting its weights for both causal and bidirectional attention within a discrete diffusion framework.","It employs a block-autoregressive strategy that denoises 256-token canvases in parallel, then commits them to the sequence history via KV cache for scalable open-ended generation.","A two-stage training pipeline, comprising Supervised Fine-tuning (SFT) and Sampler Distillation & Reinforcement Learning (SD\b·RL), optimizes both generation quality and inference efficiency."],keyInsights:$R[128]=["Text diffusion models can establish a new Pareto frontier in the trade-off between generation speed and model capability, shifting from memory-bound to compute-bound execution for significant throughput gains.","The Sampler Distillation & Reinforcement Learning (SD\b·RL) training phase is crucial for compressing denoising trajectories, allowing the model to operate efficiently in a few-step regime for ultra-low latency.","Adaptive denoising with entropy-bounded token refinement and adaptive stopping allows the model to dynamically adjust computational effort, significantly reducing overall latency without compromising quality."],results:$R[129]=["DiffusionGemma achieves an average output speed of 1,500 tokens per second (TPS) on a single NVIDIA H100 GPU, a 7.1x speedup over the Gemma 4 AR baseline and 4.8x over Gemma 4 AR with MTP.","The adaptive stopping heuristic reduces the average number of effective denoising steps to approximately 12, yielding an approximate 4x reduction in overall latency.","SD\b·RL training improved combined GPQA-Diamond and LiveCodeBench-v6 scores by 10 points and increased tokens per forward pass (TPF) from 5 to nearly 20, while also producing nearly 2x shorter outputs."]},githubStars:null,githubUrl:null,hasRunReport:!1,implementation:null,marimoImplementation:null,legacyResources:$R[130]={},externalBlog:null},dataUpdateCount:2,dataUpdatedAt:1785936439499,error:null,errorUpdateCount:0,errorUpdatedAt:0,fetchFailureCount:0,fetchFailureReason:null,fetchMeta:null,isInvalidated:!1,status:"success",fetchStatus:"idle"},queryKey:$R[131]=["paper-group","019fcb5a-e145-7fee-8b73-bf4c078cd51c"],queryHash:"[\"paper-group\",\"019fcb5a-e145-7fee-8b73-bf4c078cd51c\"]"}]}}})($R["tsr"]);document.currentScript.remove()</script><script type="module" async="">import("/assets/index-CLxZMVQg.js")</script><script>($R=>$R[41].return(void 0))($R["tsr"]);$_TSR.e();document.currentScript.remove()</script></body></html>
